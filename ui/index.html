<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Gateway</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #232736;
    --border: #2d3148; --text: #e4e4e7; --text-dim: #71717a;
    --accent: #6366f1; --accent-hover: #818cf8;
    --claude: #d4a574; --gpt: #74aa9c; --gemini: #4285f4;
    --qwen: #ff6b35; --llama: #a855f7; --mistral: #f97316;
  }
  body { font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Layout */
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }

  /* Sidebar */
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .sidebar-header h1 span { background: linear-gradient(135deg, var(--accent), #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .sidebar-header p { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .search-box { padding: 12px 20px; }
  .search-box input { width: 100%; padding: 8px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text-dim); }

  .history-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .history-category { margin-bottom: 16px; }
  .history-category h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); padding: 4px 8px; margin-bottom: 4px; }
  .history-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-dim); transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
  .history-item:hover { background: var(--surface2); color: var(--text); }
  .history-item.active { background: var(--accent); color: white; }
  .history-item .models-used { display: flex; gap: 2px; margin-left: auto; }
  .history-item .dot { width: 6px; height: 6px; border-radius: 50%; }

  .new-chat-btn { margin: 12px 20px; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .new-chat-btn:hover { background: var(--accent-hover); }

  /* Main */
  .main { display: flex; flex-direction: column; overflow: hidden; }

  /* Top bar */
  .topbar { padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; background: var(--surface); }
  .mode-toggle { display: flex; background: var(--surface2); border-radius: 8px; padding: 3px; }
  .mode-btn { padding: 6px 16px; border: none; background: none; color: var(--text-dim); font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
  .mode-btn.active { background: var(--accent); color: white; }
  .model-chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .chip { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; opacity: 0.4; user-select: none; }
  .chip.selected { opacity: 1; }
  .chip[data-model="claude"] { background: rgba(212,165,116,0.15); color: var(--claude); border-color: var(--claude); }
  .chip[data-model="gpt"] { background: rgba(116,170,156,0.15); color: var(--gpt); border-color: var(--gpt); }
  .chip[data-model="gemini"] { background: rgba(66,133,244,0.15); color: var(--gemini); border-color: var(--gemini); }
  .chip[data-model="qwen"] { background: rgba(255,107,53,0.15); color: var(--qwen); border-color: var(--qwen); }
  .chip[data-model="llama"] { background: rgba(168,85,247,0.15); color: var(--llama); border-color: var(--llama); }
  .chip[data-model="mistral"] { background: rgba(249,115,22,0.15); color: var(--mistral); border-color: var(--mistral); }

  /* Response area */
  .response-area { flex: 1; overflow-y: auto; padding: 24px; }

  /* Isolated mode panels */
  .panels-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .panel-dot { width: 10px; height: 10px; border-radius: 50%; }
  .panel-name { font-size: 14px; font-weight: 600; }
  .panel-meta { margin-left: auto; font-size: 11px; color: var(--text-dim); }
  .panel-body { padding: 16px; font-size: 14px; line-height: 1.7; color: var(--text); flex: 1; overflow-y: auto; }
  .panel-body p { margin-bottom: 12px; }
  .panel-body code { background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  .panel-footer { padding: 8px 16px; border-top: 1px solid var(--border); display: flex; gap: 12px; }
  .panel-footer button { background: none; border: none; color: var(--text-dim); font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
  .panel-footer button:hover { background: var(--surface2); color: var(--text); }

  /* Chat room mode */
  .chatroom { max-width: 800px; margin: 0 auto; width: 100%; }
  .chat-msg { display: flex; gap: 12px; margin-bottom: 20px; padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  .chat-avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: white; flex-shrink: 0; }
  .chat-content { flex: 1; }
  .chat-sender { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .chat-sender .reply-tag { font-size: 11px; color: var(--text-dim); font-weight: 400; }
  .chat-text { font-size: 14px; line-height: 1.7; }
  .chat-msg.ref { border-left: 3px solid var(--accent); opacity: 0.85; }

  /* Input area */
  .input-area { padding: 16px 24px; border-top: 1px solid var(--border); background: var(--surface); }
  .input-wrap { max-width: 800px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  .input-wrap textarea { flex: 1; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 14px; font-family: inherit; resize: none; outline: none; min-height: 48px; max-height: 160px; }
  .input-wrap textarea:focus { border-color: var(--accent); }
  .input-wrap textarea::placeholder { color: var(--text-dim); }
  .send-btn { width: 48px; height: 48px; background: var(--accent); border: none; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; flex-shrink: 0; }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn svg { width: 20px; height: 20px; fill: white; }

  /* Empty state */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); }
  .empty-state h2 { font-size: 24px; color: var(--text); margin-bottom: 8px; }
  .empty-state p { font-size: 14px; max-width: 400px; text-align: center; line-height: 1.6; }
  .empty-suggestions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; justify-content: center; }
  .suggestion { padding: 8px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .suggestion:hover { border-color: var(--accent); color: var(--accent); }

  /* Typing indicator */
  .typing { display: inline-flex; gap: 4px; padding: 8px 0; }
  .typing span { width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%; animation: bounce 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Responsive */
  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .panels-grid { grid-template-columns: 1fr; }
  }

  /* Panels mode styles */
  body.panels-mode .webview-container { display: none; }
  body.panels-mode .response-area { padding: 0; }
  body.panels-mode .chatroom { display: none; }
  body.panels-mode .panels-grid { display: grid; position: absolute; left: -9999px; top: 0; right: 0; bottom: 0; width: 100%; height: 100%; z-index: 1000; }
  body.panels-mode .panel { margin: 0; border-radius: 0; }
</style>
</head>
<body class="tabs-mode">
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1><span>AI Gateway</span></h1>
      <p>Multi-LLM parallel inference</p>
    </div>
    <div class="search-box">
      <input type="text" placeholder="Search conversations..." id="searchInput">
    </div>
    <div class="history-list" id="historyList">
      <div class="history-category">
        <h3>Today</h3>
        <div class="history-item active" onclick="loadConversation('demo')">
          Compare code generation approaches
          <div class="models-used">
            <div class="dot" style="background:var(--claude)"></div>
            <div class="dot" style="background:var(--gpt)"></div>
            <div class="dot" style="background:var(--gemini)"></div>
          </div>
        </div>
      </div>
    </div>
    <button class="new-chat-btn" onclick="newChat()">+ New Conversation</button>
  </div>

  <!-- Main content -->
  <div class="main">
    <div class="topbar">
      <!-- Mode toggle for Tabs vs Panels -->
      <div class="mode-toggle">
        <button class="mode-btn active" onclick="setMode('tabs', this)">Tabs</button>
        <button class="mode-btn" onclick="setMode('panels', this)">Panels</button>
      </div>
      <!-- Model selection chips -->
      <div class="model-chips">
        <div class="chip selected" data-model="claude" onclick="toggleChip(this)">Claude</div>
        <div class="chip selected" data-model="gpt" onclick="toggleChip(this)">GPT-4o</div>
        <div class="chip selected" data-model="gemini" onclick="toggleChip(this)">Gemini</div>
        <div class="chip" data-model="qwen" onclick="toggleChip(this)">Qwen</div>
        <div class="chip" data-model="llama" onclick="toggleChip(this)">Llama 3</div>
        <div class="chip" data-model="mistral" onclick="toggleChip(this)">Mistral</div>
      </div>
    </div>

    <!-- Response area -->
    <div class="response-area" id="responseArea">
      <!-- Isolated mode panels (default view) -->
      <div class="panels-grid" id="isolatedView">
        <!-- Panels will be dynamically generated based on selected models -->
      </div>

      <!-- Chat room mode -->
      <div class="chatroom" id="chatroomView" style="display:none;">
        <div class="empty-state">
          <h2>Chat Room</h2>
          <p>Select a model above and ask a question. Responses will appear in conversation format.</p>
        </div>
      </div>

      <!-- Webviews container for injection -->
      <div class="webview-container" id="webviewContainer" style="display:none;"></div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-wrap">
        <textarea placeholder="Ask anything... responses appear from all selected models" rows="1" id="questionInput" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendQuestion()}"></textarea>
        <button class="send-btn" onclick="sendQuestion()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentMode = 'tabs';
  const API_BASE = window.location.origin;

  const MODEL_COLORS = { claude: 'var(--claude)', gpt: 'var(--gpt)', gemini: 'var(--gemini)', qwen: 'var(--qwen)', llama: 'var(--llama)', mistral: 'var(--mistral)' };
  const MODEL_NAMES = { claude: 'Claude', gpt: 'GPT-4o', gemini: 'Gemini', qwen: 'Qwen', llama: 'Llama 3', mistral: 'Mistral' };
  const MODEL_INITIALS = { claude: 'C', gpt: 'G', gemini: 'Ge', qwen: 'Q', llama: 'L', mistral: 'M' };

  // Escape HTML to prevent XSS
  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Convert basic markdown-like text to HTML paragraphs
  function formatResponse(text) {
    if (!text) return '';
    return text.split('\n\n').map(p => {
      let html = esc(p).replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return `<p>${html}</p>`;
    }).join('');
  }

  function setMode(mode, btn) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const body = document.body;
    if (mode === 'tabs') {
      body.classList.remove('panels-mode');
      body.classList.add('tabs-mode');
    } else {
      body.classList.remove('tabs-mode');
      body.classList.add('panels-mode');
    }
  }

  function toggleChip(el) {
    el.classList.toggle('selected');
  }

  // Get selected models
  function getSelectedModels() {
    return [...document.querySelectorAll('.chip.selected')].map(c => c.dataset.model);
  }

  // Generate panel HTML for a model
  function createPanelHTML(model) {
    const color = MODEL_COLORS[model];
    const name = MODEL_NAMES[model];
    const initials = MODEL_INITIALS[model];
    return `
      <div class="panel" data-model="${model}">
        <div class="panel-header">
          <div class="panel-dot" style="background:${color}"></div>
          <span class="panel-name">${name}</span>
          <span class="panel-meta">loading...</span>
        </div>
        <div class="panel-body" data-model="${model}"><div class="typing"><span></span><span></span><span></span></div></div>
        <div class="panel-footer">
          <button onclick="copyPanel('${model}')">Copy</button>
          <button onclick="expandPanel('${model}')">Expand</button>
        </div>`;
  }

  // Generate chatroom message HTML for a model
  function createChatMsgHTML(model, replyTo = null) {
    const color = MODEL_COLORS[model];
    const name = MODEL_NAMES[model];
    const initials = MODEL_INITIALS[model];
    const replyTag = replyTo ? `<span class="reply-tag">replying to ${MODEL_NAMES[replyTo]}</span>` : '';
    return `
      <div class="chat-msg" data-model="${model}" style="${replyTo ? 'border-left: 3px solid var(--accent); opacity: 0.85;' : ''}">
        <div class="chat-avatar" style="background: ${color}">${initials}</div>
        <div class="chat-content">
          <div class="chat-sender" style="color:${color}">${name} ${replyTag}</div>
          <div class="chat-text"><div class="typing"><span></span><span></span><span></span></div></div>
        </div>`;
  }

  // Isolated mode: create panels for selected models
  function runIsolated(models) {
    const grid = document.getElementById('isolatedView');
    grid.innerHTML = '';
    
    models.forEach(m => {
      const panel = document.createElement('div');
      panel.className = 'panel';
      panel.dataset.model = m;
      panel.innerHTML = createPanelHTML(m);
      grid.appendChild(panel);
    });
  }

  // Chatroom mode: create chat messages for selected models
  function runChatroom(models) {
    const room = document.getElementById('chatroomView');
    
    // Clear and rebuild
    room.innerHTML = '';
    
    if (models.length > 0) {
      models.forEach((m, i) => {
        const msg = document.createElement('div');
        msg.className = 'chat-msg';
        msg.dataset.model = m;
        msg.innerHTML = createChatMsgHTML(m, i > 0 ? models[i-1] : null);
        room.appendChild(msg);
      });
    } else {
      room.innerHTML = '<div class="empty-state"><h2>Chat Room</h2><p>Select a model above and ask a question.</p></div>';
    }
  }

  // Send question handler
  function sendQuestion() {
    const input = document.getElementById('questionInput');
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    input.style.height = 'auto';

    const selected = getSelectedModels();
    if (selected.length === 0) { alert('Select at least one model'); return; }

    if (currentMode === 'isolated') {
      runIsolated(selected);
    } else {
      runChatroom(selected);
    }
  }

  // Listen for unified responses
  if (window.aiGateway && window.aiGateway.onUnifiedResponse) {
    window.aiGateway.onUnifiedResponse(function(data) {
      const { platform, content, tokens, durationMs, done } = data;
      
      if (currentMode === 'isolated') {
        // Update isolated panel
        const body = document.querySelector(`.panel-body[data-model="${platform}"]`);
        const meta = document.querySelector(`.panel-meta[data-model="${platform}"]`);
        if (!body || !meta) return;

        if (done && content) {
          const secs = ((durationMs || 0) / 1000).toFixed(1);
          meta.textContent = `${secs}s · ${tokens || '?'} tokens`;
          body.innerHTML = formatResponse(content);
          body.dataset.rawText = content;
        } else if (content) {
          if (body.querySelector('.typing')) {
            body.innerHTML = '';
          }
          body.innerHTML = formatResponse(content);
          meta.textContent = 'generating...';
        }
      } else if (currentMode === 'chatroom') {
        // Update chatroom message
        const indicator = document.querySelector(`.chat-msg[data-model="${platform}"]`);
        if (!indicator) return;
        const textEl = indicator.querySelector('.chat-text');

        if (done && content) {
          textEl.innerHTML = formatResponse(content);
        } else if (content) {
          if (textEl.querySelector('.typing')) textEl.innerHTML = '';
          textEl.innerHTML = formatResponse(content);
        }

        const room = document.getElementById('chatroomView');
        if (room) room.scrollTop = room.scrollHeight;
      }
    });
  }

  // Copy panel content
  function copyPanel(model) {
    const body = document.querySelector(`.panel-body[data-model="${model}"]`);
    const text = body?.dataset?.rawText || body?.textContent || '';
    navigator.clipboard.writeText(text).then(() => {
      const btn = event.target;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1500);
    });
  }

  // Expand panel (toggle full width)
  function expandPanel(model) {
    const panel = event.target.closest('.panel');
    const grid = document.getElementById('isolatedView');
    if (panel.style.gridColumn === '1 / -1') {
      panel.style.gridColumn = '';
      event.target.textContent = 'Expand';
    } else {
      panel.style.gridColumn = '1 / -1';
      event.target.textContent = 'Collapse';
    }
  }

  function loadConversation(id) {
    document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
    event.target.closest('.history-item').classList.add('active');
  }

  function newChat() {
    document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
    if (currentMode === 'isolated') {
      document.getElementById('isolatedView').innerHTML = `
        <div class="empty-state">
          <h2>Ask anything</h2>
          <p>Select your models above and ask a question. Responses will appear side by side for easy comparison.</p>
          <div class="empty-suggestions">
            <div class="suggestion" onclick="document.getElementById('questionInput').value=this.textContent;sendQuestion()">Compare sorting algorithms</div>
            <div class="suggestion" onclick="document.getElementById('questionInput').value=this.textContent;sendQuestion()">Write a marketing email</div>
            <div class="suggestion" onclick="document.getElementById('questionInput').value=this.textContent;sendQuestion()">Explain quantum computing</div>
          </div>
        </div>`;
    } else {
      document.getElementById('chatroomView').innerHTML = '<div class="empty-state"><h2>Chat Room</h2><p>Select a model above and ask a question.</p></div>';
    }
  }

  // Auto-resize textarea
  document.getElementById('questionInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 160) + 'px';
  });

  // ── WEBVIEW MANAGEMENT (from v1) ──
  let platforms = {};
  let webviews = {};

  async function initWebviews() {
    if (!window.aiGateway) return;
    platforms = await window.aiGateway.getPlatforms();
    const { profiles, activeProfiles } = await window.aiGateway.getProfiles();
    const container = document.getElementById('webviewContainer');

    for (const [platformId, platform] of Object.entries(platforms)) {
      const profileId = activeProfiles[platformId] || 'default';
      await createWebview(platformId, profileId, platform, container);
    }
    console.log('[v2] All webviews created:', Object.keys(webviews).join(', '));
  }

  async function createWebview(platformId, profileId, platform, container) {
    const key = `${platformId}-${profileId}`;
    if (webviews[key]) return webviews[key];

    const partition = await window.aiGateway.getPartition(platformId, profileId);
    const webview = document.createElement('webview');
    webview.id = `webview-${key}`;
    webview.dataset.platform = platformId;

    const savedUrl = await window.aiGateway.getLastUrl(platformId, profileId);
    webview.src = savedUrl || platform.url;
    webview.partition = partition;
    webview.setAttribute('allowpopups', '');
    webview.setAttribute('webpreferences', 'contextIsolation=yes, enableRemoteModule=false');
    webview.style.cssText = 'position:absolute;left:-9999px;width:1280px;height:800px;';

    webview.addEventListener('did-stop-loading', () => {
      console.log(`[v2] ${platformId} loaded`);
    });

    container.appendChild(webview);
    webviews[key] = webview;
    return webview;
  }

  // ── UNIFIED INJECT (sends prompt to all selected webviews) ──
  function getInjectorScript(platform, message) {
    const escaped = JSON.stringify(message);
    const injectors = {
      chatgpt: `(async()=>{try{const t=document.querySelector('textarea[id="prompt-textarea"]');if(!t)return{success:false,error:'no input'};t.focus();Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value').set.call(t,${escaped});t.dispatchEvent(new Event('input',{bubbles:true}));await new Promise(r=>setTimeout(r,300));const b=document.querySelector('button[data-testid="send-button"]');if(b&&!b.disabled){b.click();return{success:true}}t.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true}));return{success:true}}catch(e){return{success:false,error:e.message}}})()`,
      claude: `(async()=>{try{const e=document.querySelector('div[contenteditable="true"]');if(!e)return{success:false,error:'no editor'};e.focus();e.innerHTML='';const p=document.createElement('p');p.textContent=${escaped};e.appendChild(p);e.dispatchEvent(new Event('input',{bubbles:true}));await new Promise(r=>setTimeout(r,300));const b=document.querySelector('button[aria-label="Send Message"]');if(b&&!b.disabled){b.click();return{success:true}}e.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true}));return{success:true}}catch(e){return{success:false,error:e.message}}})()`,
      gemini: `(async()=>{try{const e=document.querySelector('.ql-editor,[contenteditable="true"]');if(!e)return{success:false,error:'no editor'};e.focus();e.innerHTML='<p>'+${escaped}+'</p>';e.dispatchEvent(new Event('input',{bubbles:true}));await new Promise(r=>setTimeout(r,300));const b=document.querySelector('button[aria-label="Send message"]');if(b&&!b.disabled){b.click();return{success:true}}e.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true}));return{success:true}}catch(e){return{success:false,error:e.message}}})()`,
    };
    const generic = `(async()=>{try{let i=document.querySelector('textarea:not([readonly])');if(!i)i=document.querySelector('[contenteditable="true"]');if(!i)return{success:false,error:'no input'};i.focus();if(i.tagName==='TEXTAREA'){Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value').set.call(i,${escaped});i.dispatchEvent(new Event('input',{bubbles:true}))}else{i.innerText=${escaped};i.dispatchEvent(new Event('input',{bubbles:true}))}await new Promise(r=>setTimeout(r,300));for(const s of['button[aria-label*="send" i]','button[aria-label*="submit" i]','button[class*="send" i]','button[type="submit"]']){const b=document.querySelector(s);if(b&&!b.disabled){b.click();return{success:true}}}i.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true}));return{success:true}}catch(e){return{success:false,error:e.message}}})()`;
    return injectors[platform] || generic;
  }

  function getExtractorScript(platform) {
    const extractors = {
      chatgpt: `(()=>{const m=document.querySelectorAll('[data-message-author-role="assistant"]');if(!m.length)return{content:'',done:false};const l=m[m.length-1];const c=l.innerText||'';const s=document.querySelector('button[data-testid="stop-button"]');return{content:c,done:!s&&c.length>0}})()`,
      claude: `(()=>{const m=document.querySelectorAll('.font-claude-message,[class*="message-content"]');if(!m.length)return{content:'',done:false};const l=m[m.length-1];const c=l.innerText||'';const s=document.querySelector('[data-is-streaming="true"]');return{content:c,done:!s&&c.length>0}})()`,
      gemini: `(()=>{const m=document.querySelectorAll('model-response,[class*="response-content"]');if(!m.length)return{content:'',done:false};const l=m[m.length-1];const c=l.innerText||'';const s=document.querySelector('mat-progress-bar,.loading-indicator');return{content:c,done:!s&&c.length>0}})()`,
    };
    const generic = `(()=>{const m=document.querySelectorAll('[class*="message"],[class*="response"],[class*="answer"]');if(!m.length)return{content:'',done:false};const l=m[m.length-1];const c=l.innerText||'';return{content:c,done:c.length>0}})()`;
    return extractors[platform] || generic;
  }

  // Override sendQuestion to use webview injection
  const _origSendQuestion = sendQuestion;
  sendQuestion = async function() {
    const input = document.getElementById('questionInput');
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    input.style.height = 'auto';

    const selected = getSelectedModels();
    if (selected.length === 0) { alert('Select at least one model'); return; }

    // Create UI panels/messages
    if (currentMode === 'tabs') {
      runIsolated(selected);
    } else {
      runChatroom(selected);
    }

    // Inject into webviews
    for (const platform of selected) {
      const wv = document.querySelector(`webview[data-platform="${platform}"]`);
      if (!wv) { console.log(`[v2] No webview for ${platform}`); continue; }

      try {
        const script = getInjectorScript(platform, q);
        const result = await wv.executeJavaScript(script);
        console.log(`[v2] Inject ${platform}:`, result);

        if (result && result.success) {
          startResponsePolling(platform, wv);
        }
      } catch (e) {
        console.error(`[v2] Inject error ${platform}:`, e);
      }
    }
  };

  function startResponsePolling(platform, webview) {
    let lastContent = '';
    let tokenCount = 0;
    const startTime = Date.now();
    const script = getExtractorScript(platform);

    const poll = setInterval(async () => {
      try {
        const result = await webview.executeJavaScript(script);
        if (!result || !result.content) return;

        if (result.content !== lastContent) {
          lastContent = result.content;
          tokenCount = result.content.split(/\s+/).length;

          updatePanel(platform, lastContent, tokenCount, Date.now() - startTime, false);
        }

        if (result.done && lastContent.length > 0) {
          clearInterval(poll);
          updatePanel(platform, lastContent, tokenCount, Date.now() - startTime, true);
        }
      } catch (e) { /* transient */ }
    }, 500);

    setTimeout(() => {
      clearInterval(poll);
      if (lastContent) updatePanel(platform, lastContent, tokenCount, Date.now() - startTime, true);
    }, 120000);
  }

  function updatePanel(platform, content, tokens, durationMs, done) {
    if (currentMode === 'tabs' || currentMode === 'isolated') {
      const body = document.querySelector(`.panel-body[data-model="${platform}"]`);
      const meta = document.querySelector(`.panel[data-model="${platform}"] .panel-meta`);
      if (!body) return;
      if (done) {
        if (meta) meta.textContent = `${(durationMs/1000).toFixed(1)}s \u00b7 ${tokens} tokens`;
        body.innerHTML = formatResponse(content);
        body.dataset.rawText = content;
      } else {
        if (body.querySelector('.typing')) body.innerHTML = '';
        body.innerHTML = formatResponse(content);
        if (meta) meta.textContent = 'generating...';
      }
    } else {
      const msg = document.querySelector(`.chat-msg[data-model="${platform}"]`);
      if (!msg) return;
      const textEl = msg.querySelector('.chat-text');
      if (done && content) textEl.innerHTML = formatResponse(content);
      else if (content) {
        if (textEl.querySelector('.typing')) textEl.innerHTML = '';
        textEl.innerHTML = formatResponse(content);
      }
    }
  }

  // Initialize webviews on load
  initWebviews();

  // Initialize mode from localStorage if available
  const savedMode = localStorage.getItem('aiGatewayMode');
  if (savedMode === 'panels') {
    setMode('panels', document.querySelector('.mode-btn:nth-child(2)'));
  }
</script>
